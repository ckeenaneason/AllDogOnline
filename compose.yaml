# COMMANDS
# docker compose up
# -- installs dependencies, builds the extension into apps/extension/dist, and rebuilds on changes for live dev
# docker compose run --rm test
# -- runs the core unit tests once
#
# see README for more

# Define global 'node' config
x-node: &node
  build: .
  image: alldogonline-node
  working_dir: /app
  volumes:
    - .:/app
    # Keep node_modules inside Docker
    - node_modules:/app/node_modules

services:
  dev:
    <<: *node
    command: sh -c "npm install && npm run dev"

  test:
    <<: *node
    profiles: ['test']
    command: sh -c "npm install --no-audit --no-fund && npm test"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ADO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ADO_POSTGRES_PWD}
      POSTGRES_DB: ${ADO_POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${ADO_POSTGRES_USER} -d ${ADO_POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
  pgdata:
